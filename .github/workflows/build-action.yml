name: Backend Springboot demo Application build and test

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKER_IMAGE_NAME: devkannan107/springboot-demo-app:gta

jobs:

  # JOB 1: Build, Test and Push Docker Image
  build-and-test-workflow-job:
    runs-on: ubuntu-latest

    steps:
      - name: Git code clone
        uses: actions/checkout@v7

      - name: List directory
        run: ls

      - name: Java install 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven test
        run: mvn test

      - name: Maven build
        run: mvn clean install -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image build
        run: docker build -t "$DOCKER_IMAGE_NAME" .

      - name: Docker image push
        run: docker push "$DOCKER_IMAGE_NAME"


  # JOB 2: Deploy to Local Docker Desktop Kubernetes
  deploy-k8s-workflow-job:
    runs-on: [ self-hosted, Windows, X64 ]
    needs: build-and-test-workflow-job

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass

    steps:
      - name: Git code clone
        uses: actions/checkout@v7

      - name: Check Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Create GTA deployment and service
        run: kubectl apply -f k8s/

      - name: Restart GTA deployment
        run: kubectl rollout restart deployment/springboot-demo-gta

      - name: Verify GTA deployment
        run: kubectl rollout status deployment/springboot-demo-gta --timeout=180s

      - name: Check GTA pods
        run: kubectl get pods -l app=springboot-demo-gta

      - name: Check GTA service
        run: kubectl get service springboot-demo-gta-service
