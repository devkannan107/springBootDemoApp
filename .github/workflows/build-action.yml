name: Backend Springboot demo Application build and test
on:
  push:
    branches:
      - main

jobs:
  build-and-test-workflow-job:
    runs-on: ubuntu-latest
    steps:
      - name: 'Git code clone'
        uses: actions/checkout@v7

      - name: 'list directory'
        run: ls

      - name: 'mvn version'
        run:  mvn -version
      - name: 'Java version'
        run: java -version

      - name: 'test stage'
        run: mvn test

      - name: 'build stage'
        run:  mvn clean install -DskipTests=true
