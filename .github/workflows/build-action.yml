name: Backend Springboot demo Application build and test

on:
  push:
    branches:
      - main

jobs:
  build-and-test-workflow-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Git code clone
        uses: actions/checkout@v7

      # Step 2: List project directory
      - name: List directory
        run: ls

      # Step 3: Install Java 21
      - name: Java install 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Step 4: Execute Maven tests
      - name: Maven test
        run: mvn test

      # Step 5: Build application
      - name: Maven build
        run: mvn clean install -DskipTests

      # Step 6: Docker image build
      - name: docker image build
        run: docker build -t devkannan107/springboot-demo-app:gta .

      # Step 7: Docker hub login
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
