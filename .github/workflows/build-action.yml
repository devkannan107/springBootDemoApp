name: Backend Springboot demo Application build and test
on:
  push:
    branches:
      - main

jobs:
  build-and-test-workflow-job:
    runs-on: ubuntu-latest
    steps:
      - name: 'Git code clone'
        uses: actions/checkout@v7

      - name: 'list directory'
        run: ls

      - name: 'Java install 21'
        uses: actions/checkout@v7
        with:
          distribution: temurin
          java-version: '21'
      - run: java --version

      - name: 'mvn version'
        run:  mvn -version
      - name: 'Java version'
        run: java -version


