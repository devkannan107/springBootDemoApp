name: Backend Springboot demo Application build and test
on: 
  workflow_dispatch
  
jobs:
  build-and-test-workflow-job:
    runs-on: ubuntu-latest
    steps:
      - name: 'Git code clone'
        run: git checkout https://github.com/devkannan107/springBootDemoApp.git

      - name: 'list directory'
        run: ls

      - name: 'test stage'
        run: mvn test
